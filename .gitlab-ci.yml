include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  BuildCacheKey: Tgs.MessageQueue.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish

build-code:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true

unit-test:
  stage: test
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build
  needs:
    - build-code
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  artifacts:
    when: always
    reports:
      junit: ./TestReports/*-TestReport.xml

push-nuget:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  script:
    - dotnet pack -c $BuildConfiguration "Tgs.MessageQueue/Tgs.MessageQueue.csproj" --no-restore
    - dotnet nuget push "Tgs.MessageQueue/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
    - dotnet pack -c $BuildConfiguration "Tgs.MessageQueue.Nats/Tgs.MessageQueue.Nats.csproj" --no-restore
    - dotnet nuget push "Tgs.MessageQueue.Nats/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
    - dotnet pack -c $BuildConfiguration "Tgs.MessageQueue.RabbitMQ/Tgs.MessageQueue.RabbitMQ.csproj" --no-restore
    - dotnet nuget push "Tgs.MessageQueue.RabbitMQ/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
    - dotnet pack -c $BuildConfiguration "Tgs.MessageQueue.MongoDB/Tgs.MessageQueue.MongoDB.csproj" --no-restore
    - dotnet nuget push "Tgs.MessageQueue.MongoDB/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
    - dotnet pack -c $BuildConfiguration "Tgs.MessageQueue.InProcess/Tgs.MessageQueue.InProcess.csproj" --no-restore
    - dotnet nuget push "Tgs.MessageQueue.InProcess/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
    - dotnet pack -c $BuildConfiguration "Tgs.MessageQueue.Compatible/Tgs.MessageQueue.Compatible.csproj" --no-restore
    - dotnet nuget push "Tgs.MessageQueue.Compatible/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"
    paths:
      - Tgs.MessageQueue/bin/$BuildConfiguration/*.nupkg
      - Tgs.MessageQueue.Nats/bin/$BuildConfiguration/*.nupkg
      - Tgs.MessageQueue.RabbitMQ/bin/$BuildConfiguration/*.nupkg
      - Tgs.MessageQueue.MongoDB/bin/$BuildConfiguration/*.nupkg
      - Tgs.MessageQueue.Inprocess/bin/$BuildConfiguration/*.nupkg
      - Tgs.MessageQueue.Compatible/bin/$BuildConfiguration/*.nupkg
